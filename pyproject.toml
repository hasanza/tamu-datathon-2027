[project]
name = "control-tower"
version = "0.1.0"
description = "Wacky Wheels Control Tower - event-driven multi-agent operations control tower (Hack the Highway datathon)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "networkx>=3.3",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "mcp>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_tower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["hack_the_highway", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format owns line length; long message strings are fine
